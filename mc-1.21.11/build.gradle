plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.19.4'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = 'com.turbocraft'
base { archivesName = 'turbocraft' }

sourceSets {
    main {
        java { srcDirs = ['../common/src/main/java'] }
        resources { srcDirs = ['../common/src/main/resources'] }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
    def props = [version: project.version, minecraft_version: project.minecraft_version]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
